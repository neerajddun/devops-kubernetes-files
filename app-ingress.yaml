apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: oct
  labels:
    app.kubernetes.io/name: app-ingress
spec:
  rules:
    - host: dashboard.cc
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: app-test-svc
                port:
                  number: 80
