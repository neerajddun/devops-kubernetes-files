apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-pv
  namespace: oct
spec:
  capacity:
    storage: 1Gi
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-pvc
  namespace: oct
spec:
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-test
  namespace: oct
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-test
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: app-test
    spec:
      serviceAccountName: sa-deployer
      containers:
        - name: app-test
          image: nginx:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "100Mi"
              cpu: "100m"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: my-mount
              mountPath: /usr/share/nginx/html
      volumes:
        - name: my-mount
          persistentVolumeClaim:
            claimName: app-pvc
